<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorschau und Seite</title>
<style>
  :root {
    --bg:        #eef2f7;
    --card:      #ffffff;
    --ink:       #14213d;
    --muted:     #5b6780;
    --line:      #d5dce8;
    --accent:    #2a6fdb;
  }

  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 24px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .thumb { height: 150px; }
  .txt { padding: 16px 18px 20px; }
  .txt h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .txt p { margin: 0; color: var(--muted); }
  .hero { height: 260px; border-radius: 14px; margin-bottom: 24px; }
  .back { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; margin-bottom: 24px; }
  .back:hover { border-color: var(--accent); }
  article p { max-width: 62ch; }

  .berge { background: linear-gradient(var(--berge-1), var(--berge-2)); }
  .meer  { background: linear-gradient(var(--meer-1), var(--meer-2)); }
  .wald  { background: linear-gradient(var(--wald-1), var(--wald-2)); }
</style>
</head>
<body>
<main id="app"></main>

<script>
  // Hier deine Inhalte eintragen
  const seiten = {
    berge: { titel: "Berge", vorschau: "Frische Luft und weite Blicke.", klasse: "berge",
             text: "Wer früh startet, hat den Gipfel oft für sich allein. Genug Wasser einpacken!" },
    meer:  { titel: "Meer", vorschau: "Salzige Luft und Sonnenuntergänge.", klasse: "meer",
             text: "Am schönsten ist der Strand am späten Nachmittag, wenn das Licht weich wird." },
    wald:  { titel: "Wald", vorschau: "Ruhe, Moos und lange Spaziergänge.", klasse: "wald",
             text: "Schon ein kurzer Spaziergang im Wald hilft, den Kopf freizubekommen." }
  };

  function uebersicht() {
    return `<h1>Bilder</h1>
      <p>Klick auf eine Vorschau, um ans Bild zu kommen.</p>
      <div class="grid">` +
      Object.entries(seiten).map(([id, s]) => `
        <a class="card" href="#/${id}">
          <div class="thumb ${s.klasse}"></div>
          <div class="txt"><h2>${s.titel}</h2><p>${s.vorschau}</p></div>
        </a>`).join("") + `</div>`;
  }

  function detail(id) {
    const s = seiten[id];
    return `<button class="back" onclick="location.hash=''">Zurück zur Übersicht</button>
      <div class="hero ${s.klasse}"></div>
      <article><h1>${s.titel}</h1><p>${s.text}</p></article>`;
  }

  function route() {
    const id = location.hash.replace("#/", "");
    document.getElementById("app").innerHTML = seiten[id] ? detail(id) : uebersicht();
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
