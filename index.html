<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilder</title>
<style>
  :root {
    --bg:        #eef2f7;
    --card:      #ffffff;
    --ink:       #14213d;
    --muted:     #5b6780;
    --line:      #d5dce8;
    --accent:    #2a6fdb;
    --thumb-bg:  #d5dce8;  /* Platzhalter, solange das Bild lädt */
  }

  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 24px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .thumb { display: block; width: 100%; height: 170px; object-fit: cover; background: var(--thumb-bg); }
  .txt { padding: 16px 18px 20px; }
  .txt h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .txt p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>

<script>
  // Pro Eintrag: vorschau = kleines Vorschaubild, url = Seite, die beim Klick aufgeht
  const bilder = [
    { titel: "Earth with Rings", text: "Image from Kurzgesagt.",
      vorschau: "https://sigmasite.github.io/EwR",
      url: "https://sigmasite.github.io/EwR" },
    { titel: "Meer", text: "Image from Kurzgesagt.",
      vorschau: "https://sigmasite.github.io/Blackhole",
      url: "https://sigmasite.github.io/Blackhole" },
    { titel: "Wald", text: "Ruhe, Moos und lange Spaziergänge.",
      vorschau: "https://sigmasite.github.io/JWT",
      url: "https://sigmasite.github.io/JWT" }
  ];

  document.getElementById("app").innerHTML = `
    <h1>Bilder</h1>
    <p>Klick auf eine Vorschau, um ans Bild zu kommen.</p>
    <div class="grid">` +
    bilder.map(b => `
      <a class="card" href="${b.url}" target="_blank" rel="noopener">
        <img class="thumb" src="${b.vorschau}" alt="${b.titel}" loading="lazy">
        <div class="txt"><h2>${b.titel}</h2><p>${b.text}</p></div>
      </a>`).join("") + `</div>`;
</script>
</body>
</html>
